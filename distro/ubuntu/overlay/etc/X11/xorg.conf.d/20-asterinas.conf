# SPDX-License-Identifier: MPL-2.0
#
# Xorg on simpledrm through the modesetting driver. This mirrors the
# configuration already verified on Asterinas NixOS: legacy KMS, no atomic
# commits, no page flips, and a shadow framebuffer.

Section "Device"
    Identifier  "Asterinas DRM"
    Driver      "modesetting"
    Option      "Atomic" "false"
    Option      "AccelMethod" "none"
    Option      "ShadowFB" "true"
    Option      "PageFlip" "false"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "Asterinas DRM"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x800"
    EndSubSection
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
EndSection

Section "InputDevice"
    Identifier "Keyboard"
    Driver     "evdev"
    Option     "Device" "/dev/input/event0"
EndSection

Section "ServerLayout"
    Identifier  "DefaultLayout"
    Screen      "Screen0"
    InputDevice "Keyboard" "CoreKeyboard"
EndSection
